<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Danmaku Test</title></head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<div id="result" style="position:fixed;top:0;left:0;background:white;color:black;z-index:999;padding:8px;font-family:monospace;white-space:pre"></div>
<script src="js/config.js"></script>
<script src="js/danmaku/engine.js"></script>
<script src="js/danmaku/bosses.js"></script>
<script>
(function () {
  const resultEl = document.getElementById('result');
  const out = [];
  function log(m){ out.push(m); resultEl.textContent = out.join('\n'); }
  function fail(m){ log('FAIL: '+m); resultEl.style.background='red'; throw new Error(m); }
  function ok(m){ log('PASS: '+m); }
  const canvas = document.getElementById('c');
  const bossCfg = { color:'#9a8cff', bgTop:'#0b0b1e', bgBottom:'#04040a', move:'still' };

  // --- Hitbox: collision radius must be hb/2 (3 for a king), not hb (6). ---
  const e = new DanmakuEngine(canvas, {});
  e.player = { x:240, y:580, lives:3, bombs:3, hitbox:6, focusHitbox:1.5, focus:false, invuln:0, alive:true, speed:4.2 };
  e.boss = { x:240, y:90 };
  e.bullets = []; e.playerShots = []; e.result=null;
  e.bullets.push(makeBullet(240, 580-9, 0, 0, { r:4 }));
  e._checkCollisions();
  if (e.player.lives === 3) ok('hitbox: bullet at dist 9 does NOT hit (radius=3)');
  else fail('hitbox: bullet at dist 9 hit (radius too large)');
  e.player.lives = 3; e.player.invuln = 0;
  e.bullets = [makeBullet(240, 580-5, 0, 0, { r:4 })];
  e._checkCollisions();
  if (e.player.lives === 2) ok('hitbox: bullet at dist 5 hits (radius=3)');
  else fail('hitbox: bullet at dist 5 did not hit');

  // --- Per-phase HP: each spell card has its own gauge; breaking it advances. ---
  const e2 = new DanmakuEngine(canvas, { onEnd: (r) => log('onEnd2: '+r) });
  e2.start(getPhases('rumia','normal'), bossCfg, CONFIG.DANMAKU_STATS.k, 'k');
  e2.stop();
  if (e2.phaseMaxHp === 100) ok('phase 0 has its own HP gauge (100)');
  else fail('phase 0 HP gauge wrong: '+e2.phaseMaxHp);
  e2.phaseHp = 0;
  e2.update(); // one deterministic 60fps frame
  if (e2.phaseIndex === 1) ok('breaking a card advances to the next phase');
  else fail('breaking a card did not advance (phaseIndex='+e2.phaseIndex+')');
  if (e2.phaseMaxHp === 120) ok('phase 1 has its own HP gauge (120)');
  else fail('phase 1 HP gauge wrong: '+e2.phaseMaxHp);

  // --- Shot patterns differ per piece type. ---
  const patterns = {};
  for (const t of ['k','q','r','b','n','p']) {
    const ex = new DanmakuEngine(canvas, {});
    ex.start(getPhases('rumia','normal'), bossCfg, CONFIG.DANMAKU_STATS[t], t);
    ex.stop();
    ex.player.alive = true;
    for (let i = 0; i < 30; i++) ex.update();
    patterns[t] = { count: ex.shotPattern.count, type: ex.shotPattern.type, shape: ex.shotPattern.shape, shots: ex.playerShots.length };
  }
  log('patterns: ' + JSON.stringify(patterns));
  const shapes = new Set(Object.values(patterns).map(p => p.shape));
  if (shapes.size >= 3) ok('shot patterns have shape variety ('+shapes.size+' shapes)');
  else fail('shot patterns lack shape variety');
  // Patterns must match their characters: Reimu's orbs home (her normal shot
  // "usually has homing properties"), Marisa fires a continuous laser, and
  // the rook keeps its two-shot knife stream.
  if (patterns.k.count === 5 && patterns.k.type === 'homing' &&
      patterns.q.type === 'laser' && patterns.r.count === 2)
    ok('shot patterns match their characters (Reimu homing, Marisa laser, rook stream)');
  else fail('shot patterns do not match their characters: ' +
    JSON.stringify({ k: patterns.k, q: patterns.q, r: patterns.r }));

  // --- Marisa's laser: continuous beam, damages only when aligned. ---
  // The boss position is driven by its movement script (recomputed every
  // frame), so we steer the PLAYER relative to the boss instead.
  const eL = new DanmakuEngine(canvas, {});
  eL.start(getPhases('rumia','normal'), bossCfg, CONFIG.DANMAKU_STATS.q, 'q');
  eL.stop();
  eL.player.alive = true;
  const steerPlayer = (mode) => {
    // 'aligned': ship directly under the boss; 'off': on the far side of
    // the screen so the beam can never overlap the boss.
    if (mode === 'aligned') eL.player.x = eL.boss.x;
    else eL.player.x = eL.boss.x < eL.W / 2 ? eL.W - 10 : 10;
    eL.bullets.length = 0; // keep the player safe while measuring
  };
  steerPlayer('aligned');
  const hpA = eL.phaseHp;
  for (let i = 0; i < 60; i++) { steerPlayer('aligned'); eL.update(); }
  const dmgAligned = hpA - eL.phaseHp;
  if (Math.abs(dmgAligned - 30) <= 1) ok('laser: aligned beam deals ~30 damage/sec');
  else fail('laser: aligned damage wrong (' + dmgAligned + ' over 60 frames)');
  const hpB = eL.phaseHp;
  for (let i = 0; i < 30; i++) { steerPlayer('off'); eL.update(); }
  if (eL.phaseHp === hpB) ok('laser: no damage while off-axis');
  else fail('laser: off-axis boss took ' + (hpB - eL.phaseHp) + ' damage');

  // --- Boss bullets have shape variety (art). ---
  const e3 = new DanmakuEngine(canvas, {});
  e3.start(getPhases('rumia','normal'), bossCfg, CONFIG.DANMAKU_STATS.k, 'k');
  e3.stop();
  for (let i = 0; i < 60; i++) e3.update();
  const bulletShapes = new Set(e3.bullets.map(b => b.shape));
  log('bullet shapes: ' + JSON.stringify([...bulletShapes]));
  if (bulletShapes.size >= 2) ok('boss bullets have shape variety ('+JSON.stringify([...bulletShapes])+')');
  else fail('boss bullets lack shape variety');

  // --- Breaking the LAST card ends the fight (win). ---
  const e4 = new DanmakuEngine(canvas, { onEnd: (r) => log('onEnd4: '+r) });
  e4.start(getPhases('rumia','normal'), bossCfg, CONFIG.DANMAKU_STATS.k, 'k');
  e4.stop();
  e4.phaseIndex = e4.phases.length - 1;
  e4._startPhase(e4.phaseIndex);
  e4.phaseHp = 0;
  e4.update();
  if (e4.result === 'win') ok('breaking the last card ends the fight (win)');
  else fail('breaking the last card did not end the fight (result='+e4.result+')');

  // --- Input: stale keys from a previous fight must not carry over. ---
  const e5 = new DanmakuEngine(canvas, {});
  e5.start(getPhases('rumia', 'normal'), bossCfg, CONFIG.DANMAKU_STATS.k, 'k');
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'a' }));
  if (!e5.keys['a']) fail('keydown was not registered');
  e5._end('win'); // ends the fight, removes listeners, releases keys
  if (Object.keys(e5.keys).length !== 0) fail('keys were not released when the fight ended');
  e5.start(getPhases('rumia', 'normal'), bossCfg, CONFIG.DANMAKU_STATS.k, 'k'); // next fight
  if (Object.keys(e5.keys).length !== 0) fail('stale keys carried into the next fight');
  ok('stale keys do not carry over between fights');

  // --- Focus: hold Shift (slower ship + smaller hitbox); release to unfocus. ---
  const e6 = new DanmakuEngine(canvas, {});
  e6.start(getPhases('rumia', 'normal'), bossCfg, CONFIG.DANMAKU_STATS.k, 'k');
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Shift' }));
  if (!e6.player.focus) fail('holding Shift did not enable focus');
  window.dispatchEvent(new KeyboardEvent('keyup', { key: 'Shift' }));
  if (e6.player.focus) fail('releasing Shift did not disable focus');
  ok('focus is hold-to-focus (Shift down/up)');
  // Focused ship moves at half speed (update() = exactly one 60fps frame).
  e6.player.x = 240; e6.player.y = 580;
  e6.player.focus = true;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'arrowleft' }));
  for (let i = 0; i < 30; i++) e6.update();
  const focusedDist = Math.abs(240 - e6.player.x);
  window.dispatchEvent(new KeyboardEvent('keyup', { key: 'arrowleft' }));
  e6.player.focus = false;
  e6.player.x = 240;
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'arrowleft' })); // hold again at full speed
  for (let i = 0; i < 30; i++) e6.update();
  const normalDist = Math.abs(240 - e6.player.x);
  window.dispatchEvent(new KeyboardEvent('keyup', { key: 'arrowleft' }));
  if (!(focusedDist > 0 && normalDist > focusedDist * 1.8))
    fail('focus should slow the ship (focused=' + focusedDist + 'px, normal=' + normalDist + 'px / 30 frames)');
  ok('focus slows the ship (' + focusedDist + 'px vs ' + normalDist + 'px per 30 frames)');
  // Bullets are NOT slowed by focus.
  e6.bullets = [makeBullet(240, 300, 0, 3)];
  const by0 = e6.bullets[0].y;
  e6.player.focus = true;
  for (let i = 0; i < 60; i++) e6.update();
  if (Math.abs(e6.bullets[0].y - by0) !== 180)
    fail('bullets should keep full speed under focus (moved ' + (e6.bullets[0].y - by0) + 'px, expected 180)');
  ok('bullets keep full speed while focused');
  e5.stop();
  e6.stop();

  log('ALL DANMAKU TESTS PASSED');
  resultEl.style.background = 'lime';
})();
</script>
</body>
</html>
